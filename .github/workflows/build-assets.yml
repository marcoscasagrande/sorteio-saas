name: Build assets

# Builda o CSS/JS automaticamente sempre que você alterar algo em
# resources/ e sobe direto pro branch — assim você nunca precisa ter
# Node instalado localmente nem no servidor.
on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'tailwind.config.js'
      - 'vite.config.js'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Commit assets buildados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/build
          git diff --staged --quiet || git commit -m "chore: rebuild assets [skip ci]"
          git push
